name: Deploy to GitHub Pages

# Static site: typecheck, unit tests, build with the repository subpath, E2E smoke, publish.
on:
  push:
    # `master` is this repository's working branch; `main` is kept so a rename still deploys.
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      # Cache the browser download (~680MB) keyed on the resolved Playwright version, so a
      # routine push only spends a few seconds here instead of downloading Chromium again.
      # The version comes from the installed package rather than package.json's range, so
      # the key changes exactly when the browser revision could have changed.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # `--with-deps` runs apt-get update + install of Chromium's system libraries. The
      # ubuntu-latest image already ships them, and that apt call is the slowest and least
      # predictable step we have (22s normally, but a stalled mirror once took 637s and
      # re-ran every job). `--dry-run` verifies the libraries are still present and fails
      # with a named package instead of a mystery browser-launch error if they are not.
      # The retry guards the browser download against transient network failures.
      - name: Install Playwright Chromium
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium || npx playwright install chromium
          fi
          npx playwright install-deps chromium --dry-run
      - name: Typecheck and unit tests
        run: npx tsc -b && npx vitest run
      # Build once: the same `dist/` is served to Playwright and uploaded to Pages.
      - name: Build with the repository subpath
        run: npx vite build
        env:
          # BASE_PATH must match the repository name for project pages. For a user or
          # organisation site (https://<user>.github.io) change both values to "/" here.
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: End-to-end tests (production build served from the repo subpath)
        run: npx playwright test
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          E2E_BASE_PATH: /${{ github.event.repository.name }}/
          E2E_SKIP_BUILD: '1'
          CI: 'true'
      - name: Verify the service worker was versioned
        run: test -s dist/sw.js && test -s dist/sw-version.txt && grep -q "algebra-playground-" dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Keep the Playwright report when something fails, so failures are diagnosable.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
