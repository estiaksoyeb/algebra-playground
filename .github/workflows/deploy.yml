name: Deploy to GitHub Pages

# Static site: typecheck, unit tests, build with the repository subpath, E2E smoke, publish.
on:
  push:
    # `master` is this repository's working branch; `main` is kept so a rename still deploys.
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc -b
      - name: Unit and component tests
        run: npx vitest run
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # Build once, before Playwright starts, so the E2E webServer timeout only covers
      # serving the site. Building inside Playwright's webServer command made CI reach the
      # 180s timeout while still compiling.
      - name: Build with the repository subpath
        run: npx vite build
        env:
          # BASE_PATH must match the repository name for project pages. For a user or
          # organisation site (https://<user>.github.io) change both values to "/" here.
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: End-to-end tests (production build served from the repo subpath)
        run: npx playwright test
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          E2E_BASE_PATH: /${{ github.event.repository.name }}/
          E2E_SKIP_BUILD: '1'
          CI: 'true'
      - name: Verify the service worker was versioned
        run: test -s dist/sw.js && test -s dist/sw-version.txt && grep -q "algebra-playground-" dist/sw.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Keep the Playwright report when something fails, so failures are diagnosable.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
